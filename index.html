<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172554">
<meta name="description" content="개인용 근무 신청 및 확정·반려 관리 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>근무톡</title>
<style>
:root{color-scheme:light;--navy:#172554;--blue:#2563eb;--bg:#f3f5f9;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#0f172a;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:var(--navy);color:#fff;padding:24px 18px 20px;border-radius:0 0 22px 22px}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:#cbd5e1;font-size:13px}
main{max-width:700px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;margin:0 0 14px;overflow:auto}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;white-space:nowrap;font-weight:650}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.panel,.application{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0f172a08}.panel h2{font-size:17px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:650}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;font:inherit;background:white;color:#0f172a;min-width:0}textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:11px;padding:11px 13px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white;width:100%}.approve{background:#dcfce7;color:#166534;flex:1}.reject{background:#fee2e2;color:#991b1b;flex:1}.neutral{background:#e2e8f0;color:#334155}.delete{background:#f1f5f9;color:#64748b;padding:8px 10px;font-size:12px}
.cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.cardtop h3{margin:0;font-size:17px}.muted{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}.status{font-size:12px;font-weight:750;padding:5px 9px;border-radius:999px;white-space:nowrap}.pending{background:#fef3c7;color:#92400e}.confirmed{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;margin-top:13px}.reason{background:#fff7f7;border-radius:9px;padding:9px;margin-top:10px;font-size:13px;color:#991b1b}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.small{font-size:12px;color:var(--muted);line-height:1.5}.hidden{display:none!important}
</style>
</head>
<body>
<header><h1>근무톡</h1><p>나만 사용하는 근무 신청 · 확정 · 반려 관리</p></header>
<main>
  <nav class="tabs" aria-label="화면 선택">
    <button class="tab active" data-tab="list">신청 관리</button>
    <button class="tab" data-tab="add">신청 추가</button>
    <button class="tab" data-tab="backup">데이터 관리</button>
  </nav>
  <section id="listView">
    <div class="panel">
      <h2>신청 현황</h2>
      <div id="counts" class="grid"></div>
    </div>
    <div id="applications"></div>
  </section>
  <section id="addView" class="hidden">
    <div class="panel">
      <h2 id="formTitle">근무 신청 추가</h2>
      <form id="appForm">
        <input type="hidden" id="editId">
        <div class="grid">
          <div class="field"><label for="center">센터</label><input id="center" placeholder="예: 천안6센터" required></div>
          <div class="field"><label for="job">근무 유형</label><input id="job" placeholder="예: 출고" required></div>
          <div class="field"><label for="date">근무 날짜</label><input id="date" type="date" required></div>
          <div class="field"><label for="start">시작 시간</label><input id="start" type="time" value="19:00" required></div>
          <div class="field"><label for="end">종료 시간</label><input id="end" type="time" value="04:00" required></div>
          <div class="field"><label for="breakStart">휴식 시작</label><input id="breakStart" type="time" value="22:00"></div>
          <div class="field"><label for="breakEnd">휴식 종료</label><input id="breakEnd" type="time" value="23:00"></div>
          <div class="field full"><label for="note">메모 (선택)</label><textarea id="note" placeholder="개인 메모"></textarea></div>
        </div>
        <button class="primary" type="submit">신청 저장</button>
        <button class="neutral hidden" type="button" id="cancelEdit" style="width:100%;margin-top:8px">수정 취소</button>
      </form>
    </div>
  </section>
  <section id="backupView" class="hidden">
    <div class="panel">
      <h2>데이터 백업 및 복원</h2>
      <p class="small">이 버전은 데이터가 이 휴대폰의 브라우저에 저장돼. 브라우저 데이터 삭제나 기기 변경 전에 백업 파일을 내려받아 둬.</p>
      <button id="exportBtn" class="primary">백업 파일 내려받기</button>
      <div class="field" style="margin-top:14px"><label for="importFile">백업 파일 복원</label><input id="importFile" type="file" accept=".json,application/json"></div>
      <button id="clearBtn" class="neutral" style="width:100%">모든 신청 삭제</button>
    </div>
  </section>
  <p class="small">개인용 앱입니다. 여기서 확정·반려한 결과는 실제 쿠펀치나 회사 서버에 전달되지 않습니다.</p>
</main>
<script>
const KEY='geunmutalk-applications-v1';
let items=[];
try{items=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(items))items=[]}catch{items=[]}
const $=id=>document.getElementById(id);
const save=()=>{localStorage.setItem(KEY,JSON.stringify(items));render()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tab(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));['list','add','backup'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==name));if(name==='list')render()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));
function render(){
 const n=s=>items.filter(x=>x.status===s).length;
 $('counts').innerHTML=`<div><div class="muted">전체 신청</div><strong>${items.length}건</strong></div><div><div class="muted">대기 / 확정 / 반려</div><strong>${n('대기')} / ${n('확정')} / ${n('반려')}</strong></div>`;
 const root=$('applications');
 if(!items.length){root.innerHTML='<div class="panel empty">아직 신청 내역이 없어.<br>‘신청 추가’에서 첫 근무를 등록해 봐.</div>';return}
 const order={'대기':0,'확정':1,'반려':2};
 root.innerHTML=[...items].sort((a,b)=>(order[a.status]-order[b.status])||b.created-a.created).map(x=>`
 <article class="application">
 <div class="cardtop"><div><h3>${esc(x.center)} · ${esc(x.job)}</h3><div class="muted">${esc(x.date)}<br>${esc(x.start)}–${esc(x.end)}${x.breakStart&&x.breakEnd?` · 휴식 ${esc(x.breakStart)}–${esc(x.breakEnd)}`:''}</div></div><span class="status ${x.status==='확정'?'confirmed':x.status==='반려'?'rejected':'pending'}">${esc(x.status)}</span></div>
 ${x.note?`<div class="muted">메모: ${esc(x.note)}</div>`:''}
 ${x.status==='반려'&&x.reason?`<div class="reason">반려 사유: ${esc(x.reason)}</div>`:''}
 <div class="actions">${x.status!=='확정'?`<button class="approve" data-action="confirm" data-id="${x.id}">✓ 확정</button>`:''}${x.status!=='반려'?`<button class="reject" data-action="reject" data-id="${x.id}">✕ 반려</button>`:''}<button class="neutral" data-action="edit" data-id="${x.id}">수정</button><button class="delete" data-action="delete" data-id="${x.id}">삭제</button></div>
 </article>`).join('');
 root.querySelectorAll('button[data-action]').forEach(b=>b.addEventListener('click',()=>{
  const id=b.dataset.id, action=b.dataset.action, x=items.find(y=>y.id===id);if(!x)return;
  if(action==='confirm'){if(confirm(`${x.center} ${x.date} 신청을 확정할까?`)){x.status='확정';x.reason='';x.updated=Date.now();save()}}
  if(action==='reject'){const r=prompt('반려 사유를 입력해 줘. (비워 두어도 돼)');if(r===null)return;x.status='반려';x.reason=r.trim();x.updated=Date.now();save()}
  if(action==='delete'){if(confirm('이 신청 내역을 삭제할까?')){items=items.filter(y=>y.id!==id);save()}}
  if(action==='edit')editItem(x);
 }));
}
function editItem(x){$('editId').value=x.id;$('center').value=x.center;$('job').value=x.job;$('date').value=x.date;$('start').value=x.start;$('end').value=x.end;$('breakStart').value=x.breakStart||'';$('breakEnd').value=x.breakEnd||'';$('note').value=x.note||'';$('formTitle').textContent='근무 신청 수정';$('cancelEdit').classList.remove('hidden');tab('add')}
$('cancelEdit').addEventListener('click',resetForm);
function resetForm(){$('appForm').reset();$('editId').value='';$('start').value='19:00';$('end').value='04:00';$('breakStart').value='22:00';$('breakEnd').value='23:00';$('formTitle').textContent='근무 신청 추가';$('cancelEdit').classList.add('hidden')}
$('appForm').addEventListener('submit',e=>{
 e.preventDefault();const id=$('editId').value;
 const data={center:$('center').value.trim(),job:$('job').value.trim(),date:$('date').value,start:$('start').value,end:$('end').value,breakStart:$('breakStart').value,breakEnd:$('breakEnd').value,note:$('note').value.trim()};
 if(id){const x=items.find(y=>y.id===id);if(x)Object.assign(x,data,{updated:Date.now()})}
 else items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),...data,status:'대기',reason:'',created:Date.now(),updated:Date.now()});
 save();resetForm();tab('list');
});
$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'근무톡',version:1,items},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='geunmutalk-backup.json';a.click();URL.revokeObjectURL(a.href)});
$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const incoming=Array.isArray(data)?data:data.items;if(!Array.isArray(incoming)||!incoming.every(x=>x.center&&x.job&&x.date&&x.status))throw Error('형식');if(confirm('현재 신청을 백업 내용으로 교체할까?')){items=incoming;save();alert('복원했어.')} }catch{alert('올바른 근무톡 백업 파일이 아니야.')}e.target.value=''});
$('clearBtn').addEventListener('click',()=>{if(confirm('모든 신청을 삭제할까? 백업이 없다면 복구할 수 없어.')){items=[];save()}});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body></html>
